# Build fast-rich Python wheels for all major platforms and publish to PyPI.
#
# - Push to the `py-release` branch  -> build + smoke-test only (dry run).
# - Push a tag `py-v*` (e.g. py-v0.3.2) -> build, then publish to PyPI.
#
# Publishing uses PyPI Trusted Publishing (OIDC); no API token is stored.
# Configure it once at https://pypi.org/manage/project/fast-rich/settings/publishing/
#   owner: mohammad-albarham  repo: fast-rich
#   workflow: python-release.yml  environment: pypi
#
# Wheels are abi3 (cp310-abi3), so one wheel per OS/arch covers Python 3.10+.

name: Python release

on:
  push:
    branches: [py-release]
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CRATE_DIR: bindings/python

jobs:
  linux:
    name: linux (${{ matrix.target }}, ${{ matrix.manylinux }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        manylinux: [auto, musllinux_1_2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.CRATE_DIR }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Smoke test
        if: matrix.target == 'x86_64' && matrix.manylinux == 'auto'
        run: |
          pip install fast-rich --no-index --find-links "$CRATE_DIR/dist" --force-reinstall
          cd /tmp && python -c "from fast_rich.console import Console; Console().print('[bold green]fast-rich wheel OK[/]')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: ${{ env.CRATE_DIR }}/dist

  windows:
    name: windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.CRATE_DIR }}
          target: x64
          args: --release --out dist
      - name: Smoke test
        shell: bash
        run: |
          pip install fast-rich --no-index --find-links "$CRATE_DIR/dist" --force-reinstall
          cd "$RUNNER_TEMP" && python -c "from fast_rich.console import Console; Console().print('[bold green]fast-rich wheel OK[/]')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: ${{ env.CRATE_DIR }}/dist

  macos:
    name: macos (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.CRATE_DIR }}
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Smoke test
        if: matrix.target == 'aarch64'
        run: |
          pip install fast-rich --no-index --find-links "$CRATE_DIR/dist" --force-reinstall
          cd /tmp && python -c "from fast_rich.console import Console; Console().print('[bold green]fast-rich wheel OK[/]')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: ${{ env.CRATE_DIR }}/dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.CRATE_DIR }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: ${{ env.CRATE_DIR }}/dist

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fast-rich/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          ls dist
          ls dist | grep -q "fast_rich-${tag}.tar.gz" || { echo "::error::tag $GITHUB_REF_NAME does not match built version"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
