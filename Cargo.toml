[package]
name = "fast-rich"
version = "0.4.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "A Rust port of Python's Rich library for beautiful terminal formatting"
repository = "https://github.com/mohammad-albarham/fast-rich"
homepage = "https://github.com/mohammad-albarham/fast-rich"
documentation = "https://docs.rs/fast-rich"
keywords = ["terminal", "console", "color", "formatting", "rich"]
categories = ["command-line-interface", "development-tools"]
exclude = ["docs/**", "logo.png", "Makefile", "scripts/**", "benchmarks/**"]

[dependencies]
# Core dependencies
unicode-width = "0.2.3"
unicode-segmentation = "1.13.3"
crossterm = "0.29.0"

# Optional dependencies
pulldown-cmark = { version = "0.13.6", optional = true }
syntect = { version = "5.3.0", optional = true }
log = { version = "0.4.35", optional = true }
regex = { version = "1.13.1", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", features = ["preserve_order"], optional = true }

[features]
default = []
markdown = ["dep:pulldown-cmark", "syntax"]
syntax = ["dep:syntect"]
logging = ["dep:log"]
json = ["dep:regex", "dep:serde", "dep:serde_json"]
full = ["markdown", "syntax", "logging", "json"]

[dev-dependencies]
criterion = "0.8.2"

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "styles"
path = "examples/styles.rs"

[[example]]
name = "markup"
path = "examples/markup.rs"

[[example]]
name = "table"
path = "examples/table.rs"

[[example]]
name = "panel"
path = "examples/panel.rs"

[[example]]
name = "progress"
path = "examples/progress.rs"

[[example]]
name = "tree"
path = "examples/tree.rs"

[[example]]
name = "json_demo"
path = "examples/json_demo.rs"
required-features = ["json"]

[[example]]
name = "highlighter_demo"
path = "examples/highlighter_demo.rs"
required-features = ["json"]

# Examples requiring optional features
[[example]]
name = "logging"
path = "examples/logging.rs"
required-features = ["logging"]

[[example]]
name = "logging_custom"
path = "examples/logging_custom.rs"
required-features = ["logging"]

[[example]]
name = "markdown_parity"
path = "examples/markdown_parity.rs"
required-features = ["markdown"]

[[example]]
name = "fixes_showcase"
path = "examples/fixes_showcase.rs"
required-features = ["markdown"]

[[example]]
name = "syntax_highlighting"
path = "examples/syntax_highlighting.rs"
required-features = ["syntax"]

[[bench]]
name = "highlight_benchmark"
harness = false

[[bench]]
name = "render_benchmark"
harness = false
required-features = ["markdown", "syntax"]
