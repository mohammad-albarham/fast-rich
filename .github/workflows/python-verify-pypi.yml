# Install fast-rich from PyPI on Windows and macOS runners with the Rust
# toolchain deleted, then run the smoke test. Linux wheels are covered by
# bindings/python/docker/test-pypi-wheels.sh (Docker, glibc + musl, x86_64 + aarch64).

name: Python verify PyPI wheels

on:
  push:
    branches: [py-release]
    paths:
      - bindings/python/docker/**
      - .github/workflows/python-verify-pypi.yml
  workflow_dispatch:
    inputs:
      version:
        description: fast-rich version to install from PyPI
        default: "0.3.2"

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
        python: ["3.10", "3.14"]
    env:
      FAST_RICH_VERSION: ${{ inputs.version || '0.3.2' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Remove Rust toolchain
        run: |
          rm -rf "$HOME/.cargo" "$HOME/.rustup"
          # macOS runners also ship rustup via Homebrew; delete every remaining binary on PATH.
          SUDO=$([ "$RUNNER_OS" = Windows ] || echo sudo)
          for tool in cargo rustc rustup; do
            while p=$(command -v "$tool"); do echo "removing $p"; $SUDO rm -f "$p"; hash -r; done
          done
      - name: Install from PyPI
        run: python -m pip install --no-cache-dir "fast-rich==${FAST_RICH_VERSION}"
      - name: Smoke test
        run: cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/bindings/python/docker/smoke_test.py"
        env:
          PYTHONUTF8: "1"
